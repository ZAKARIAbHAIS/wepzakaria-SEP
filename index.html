<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحتي على GitHub</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial; display:flex; min-height:100vh;
           align-items:center; justify-content:center; margin:0; background:#f5f7fb; color:#111; }
    .card { background:white; padding:28px; border-radius:12px; box-shadow:0 6px 20px rgba(20,30,60,0.08); width:360px; text-align:center; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { margin:0 0 16px; color:#444; }
    .btn { display:inline-block; padding:10px 16px; border-radius:10px; text-decoration:none; font-weight:600; border:1px solid #e1e6f0; }
    .btn-primary { background:#0b63d6; color:white; border:none; }
    .btn-outline { background:transparent; color:#0b63d6; }
    .links { margin-top:12px; font-size:14px; color:#666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>مرحباً — اسمي زكريا</h1>
    <p>هذه صفحة شخصية بسيطة تربط لحساب GitHub والمشاريع.</p>

    <!-- عدّل الرابط إلى حسابك -->
    <a class="btn btn-primary" href="https://github.com/USERNAME" target="_blank" rel="noopener">عرض حساب GitHub</a>
    <div style="height:10px"></div>

    <!-- رابط لمستودع معين -->
    <a class="btn btn-outline" href="https://github.com/USERNAME/REPO" target="_blank" rel="noopener">مشروعي</a>

    <div class="links">
      <div>موقع ثابت بسيط — استعمل GitHub Pages لنشره.</div>
    </div>
  </div>
</body>
</html>
